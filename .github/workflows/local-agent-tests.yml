name: Local AI agent workshop tests
on:
  push:
    paths:
      - "local-agents/**"
      - "tests/test_local_agents.py"
      - ".github/workflows/local-agent-tests.yml"
  pull_request:
    paths:
      - "local-agents/**"
      - "tests/test_local_agents.py"
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile local-agents/server.py
      - run: python -m unittest discover -s tests -p 'test_local_agents.py' -v
